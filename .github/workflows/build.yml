name: Build VOTASHI (WinUI 3)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Find and Restore dependencies
      run: |
        $proj = Get-ChildItem -Path . -Filter *.csproj -Recurse | Select-Object -First 1
        if ($proj) {
            msbuild $proj.FullName -t:restore
        } else {
            Write-Error "Файл .csproj не найден!"
            exit 1
        }

    - name: Build and Publish
      run: |
        $proj = Get-ChildItem -Path . -Filter *.csproj -Recurse | Select-Object -First 1
        msbuild $proj.FullName /p:Configuration=Release /p:Platform=x64 /p:AppxPackageSigningEnabled=false /p:OutDir="build/"

    - name: Upload Entire Build Folder
      uses: actions/upload-artifact@v4
      with:
        name: VOTASHI_APP
        # Забираем ВСЮ папку build, что бы в ней ни лежало
        path: build/
        if-no-files-found: error

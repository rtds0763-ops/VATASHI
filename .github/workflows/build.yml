name: Build VOTASHI (WinUI 3)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Find and Restore dependencies
      run: |
        # Ищем файл .csproj во всех папках
        $proj = Get-ChildItem -Path . -Filter *.csproj -Recurse | Select-Object -First 1
        if ($proj) {
            Write-Host "Найден проект: $($proj.FullName)"
            msbuild $proj.FullName -t:restore
        } else {
            Write-Error "Файл .csproj не найден в репозитории!"
            exit 1
        }

    - name: Build and Publish
      run: |
        $proj = Get-ChildItem -Path . -Filter *.csproj -Recurse | Select-Object -First 1
        # Добавил флаг -p:AppxPackageSigningEnabled=false, он критичен для WinUI
        msbuild $proj.FullName /p:Configuration=Release /p:Platform=x64 /p:AppxPackageSigningEnabled=false

    - name: Find and Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VOTASHI_APP
        # Ищем EXE, DLL и другие файлы в ЛЮБЫХ папках проекта
        path: |
          **/VOTASHI.exe
          **/VOTASHI.dll
          **/*.json
          **/*.pri
        if-no-files-found: error

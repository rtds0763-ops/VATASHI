name: Build VOTASHI (WinUI 3)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore dependencies
      run: msbuild VOTASHI.sln -t:restore

    - name: Build Solution
      run: msbuild VOTASHI.sln /p:Configuration=Release /p:Platform=x64 /p:AppxPackageSigningEnabled=false

    - name: Find and Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VOTASHI_APP
        path: |
          **/VOTASHI.exe
          **/VOTASHI.dll
          **/*.json
          **/*.pri
        if-no-files-found: error

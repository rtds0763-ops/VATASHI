name: Build VOTASHI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Find Project
      id: find_proj
      run: |
        $proj = Get-ChildItem -Path . -Filter *.csproj -Recurse | Select-Object -First 1
        if ($proj) {
            Write-Host "Найден проект: $($proj.FullName)"
            echo "PROJ_PATH=$($proj.FullName)" >> $env:GITHUB_ENV
        } else {
            Write-Error "Файл .csproj не найден!"
            exit 1
        }

    - name: Publish Application
      run: |
        dotnet publish $env:PROJ_PATH -c Release -r win-x64 -p:Platform=x64 -p:WindowsPackageType=None -p:AppxPackageSigningEnabled=false --self-contained true -o ./publish_output

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VOTASHI_APP
        path: ./publish_output/
        if-no-files-found: error

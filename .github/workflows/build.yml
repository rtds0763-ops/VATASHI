name: Build VOTASHI (WinUI 3)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Find and Restore dependencies
      run: |
        $proj = Get-ChildItem -Path . -Filter *.csproj -Recurse | Select-Object -First 1
        if ($proj) {
            Write-Host "Найден проект: $($proj.FullName)"
            msbuild $proj.FullName -t:restore
        } else {
            Write-Error "Файл .csproj не найден в репозитории!"
        }

    - name: Build
      run: |
        $proj = Get-ChildItem -Path . -Filter *.csproj -Recurse | Select-Object -First 1
        msbuild $proj.FullName /p:Configuration=Release /p:Platform=x64

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VOTASHI_APP
        path: |
          **/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/VOTASHI.exe
          **/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/*.dll
          **/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/*.json
          **/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/*.pri
        if-no-files-found: warn
